name: lingokaksha
description: LingoKaksha - GPT-Powered German Learning App (A1-B2)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Firebase (Modernized for Xcode 16.2)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10

  # ... UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Audio
  just_audio: ^0.10.5
  audio_session: ^0.1.25
  record: ^6.2.0
  flutter_tts: ^3.8.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  collection: ^1.18.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  package_info_plus: ^9.0.1

  # Fonts bundled locally in assets/fonts/
  google_sign_in: ^6.2.1

  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1
  analyzer: ^6.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/images/branding/
    - assets/images/levels/
    - assets/images/ratings/
    - assets/images/illustrations/
    - assets/audio/
    - assets/lottie/
    - assets/data/
